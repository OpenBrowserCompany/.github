name: Feature request
description: Suggest a capability or improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first and the solution second. That makes it
        easier to find the right scope for the change.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who is affected, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they are not as good.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, links, or references that help explain the request.
